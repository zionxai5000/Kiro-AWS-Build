name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Backend (production-server Docker image -> ECR -> ECS Fargate)
  # -------------------------------------------------------------------------
  backend:
    name: Backend - build, push to ECR, force-deploy ECS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and tag image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: cdk-hnb659fds-container-assets-562887205007-us-east-1
        run: |
          IMAGE_TAG="main-$(echo $GITHUB_SHA | cut -c1-7)"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "Building $IMAGE_URI"
          docker build -t "$IMAGE_URI" .
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Push image
        env:
          IMAGE_URI: ${{ steps.build.outputs.image_uri }}
        run: docker push "$IMAGE_URI"

      - name: Register new task definition
        id: register
        env:
          IMAGE_URI: ${{ steps.build.outputs.image_uri }}
        run: |
          aws ecs describe-task-definition \
            --task-definition SeraphimdevComputeAgentRuntimeTaskDef2B3755BC \
            --region us-east-1 \
            --query 'taskDefinition' > current-td.json
          node -e "
            const fs = require('fs');
            const td = JSON.parse(fs.readFileSync('current-td.json'));
            td.containerDefinitions[0].image = process.env.IMAGE_URI;
            const out = {
              family: td.family,
              networkMode: td.networkMode,
              requiresCompatibilities: td.requiresCompatibilities,
              cpu: td.cpu,
              memory: td.memory,
              executionRoleArn: td.executionRoleArn,
              taskRoleArn: td.taskRoleArn,
              containerDefinitions: td.containerDefinitions,
            };
            fs.writeFileSync('new-td.json', JSON.stringify(out));
          "
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-td.json \
            --region us-east-1 \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered $NEW_ARN"
          echo "task_def_arn=$NEW_ARN" >> $GITHUB_OUTPUT

      - name: Force-deploy ECS service
        env:
          NEW_ARN: ${{ steps.register.outputs.task_def_arn }}
        run: |
          aws ecs update-service \
            --cluster seraphim-agents \
            --service Seraphim-dev-Compute-AgentRuntimeServiceA417A3CA-Z1fTovcH1Dpx \
            --task-definition "$NEW_ARN" \
            --force-new-deployment \
            --region us-east-1 \
            --query 'service.deployments[0].status' --output text

  # -------------------------------------------------------------------------
  # Dashboard (Vite -> S3 with no-cache headers on index.html)
  # -------------------------------------------------------------------------
  dashboard:
    name: Dashboard - build and sync to S3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install workspace deps
        run: npm ci

      - name: Build dashboard
        run: npm run build --workspace=@seraphim/dashboard

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync hashed assets (long cache)
        run: |
          aws s3 sync packages/dashboard/dist/ s3://seraphim-dashboard-live/ \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable" \
            --region us-east-1

      - name: Upload index.html (no cache)
        run: |
          aws s3 cp packages/dashboard/dist/index.html s3://seraphim-dashboard-live/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html" \
            --region us-east-1
